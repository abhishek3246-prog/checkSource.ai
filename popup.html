<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>checkSource.ai</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="icons/icon48.png" alt="" width="36" height="36" />
      <div>
        <h1>checkSource.ai</h1>
        <p class="tagline">Ready out of the box</p>
      </div>
    </header>

    <section class="card">
      <p class="status ok" id="readyStatus">Works instantly — no setup required.</p>
      <label class="toggle" style="margin-top: 10px">
        <input type="checkbox" id="autoDetect" checked />
        <span>Auto-scan images on hover</span>
      </label>
    </section>

    <section class="card">
      <label class="field-label" for="imageUrl">Analyze image URL</label>
      <div class="row">
        <input type="url" id="imageUrl" placeholder="https://…" spellcheck="false" />
        <button type="button" id="analyzeBtn" class="btn primary">Analyze</button>
      </div>
      <div id="result" class="result-host" hidden></div>
    </section>

    <section class="card collapsed">
      <details>
        <summary>Advanced (optional)</summary>
        <label class="field-label" for="hfToken" style="margin-top: 10px">Personal API token</label>
        <div class="row">
          <input
            type="password"
            id="hfToken"
            placeholder="Optional override"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" id="saveToken" class="btn primary">Save</button>
        </div>
        <p class="hint">Leave empty to use the built-in free service.</p>
        <p id="tokenStatus" class="status" aria-live="polite"></p>
      </details>
    </section>

    <footer class="footer">
      Tip: select text on a page → <strong>Check text</strong> · Developed by Abhi
    </footer>

    <script src="lib/report.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
